<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bitCyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="bitDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bitNeonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="bitShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Hexagonal Shield -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52" fill="url(#bitDarkBg)" stroke="url(#bitCyanIndigo)" stroke-width="3.5" filter="url(#bitShadow)"/>
  <polygon points="100,16 172,56 172,144 100,184 28,144 28,56" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Circuit Traces & Data Nodes -->
  <g stroke="#06B6D4" stroke-width="1.5" opacity="0.75" fill="none">
    <!-- Top & Left Connections -->
    <path d="M 50,70 L 75,70 L 85,85"/>
    <circle cx="50" cy="70" r="3" fill="#10B981"/>
    
    <path d="M 150,70 L 125,70 L 115,85"/>
    <circle cx="150" cy="70" r="3" fill="#06B6D4"/>
    
    <!-- Bottom Connections -->
    <path d="M 60,135 L 80,135 L 90,120"/>
    <circle cx="60" cy="135" r="3" fill="#6366F1"/>
    
    <path d="M 140,135 L 120,135 L 110,120"/>
    <circle cx="140" cy="135" r="3" fill="#10B981"/>
  </g>

  <!-- Central Dynamic 'BIT' Stylized Monogram -->
  <g transform="translate(100, 92)" filter="url(#bitShadow)">
    <!-- Tech Cube / Data Core Isometric Outline -->
    <polygon points="0,-42 36,-22 36,20 0,40 -36,20 -36,-22" fill="#1E1B4B" stroke="url(#bitCyanIndigo)" stroke-width="2.5" opacity="0.95"/>
    <line x1="0" y1="40" x2="0" y2="-42" stroke="url(#bitCyanIndigo)" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-42" x2="36" y2="20" stroke="url(#bitCyanIndigo)" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-42" x2="-36" y2="20" stroke="url(#bitCyanIndigo)" stroke-width="1" opacity="0.3"/>

    <!-- Dynamic Bold Monogram BIT -->
    <text x="0" y="8" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="900" fill="url(#bitCyanIndigo)" text-anchor="middle" letter-spacing="2">BIT</text>
    
    <!-- Pulse Spark / Growth Arrow -->
    <path d="M -22,-14 L -6,-24 L 6,-16 L 22,-28" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="22,-28 15,-28 20,-22" fill="#10B981"/>
  </g>

  <!-- Bottom Banner Label -->
  <rect x="42" y="148" width="116" height="22" rx="6" fill="#090D16" stroke="url(#bitCyanIndigo)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.8">BUSINESS &amp; TECH</text>
</svg>
