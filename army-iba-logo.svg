<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="armyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="armyNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="armyCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="armyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Octagonal/Circular Badge Shield -->
  <circle cx="100" cy="100" r="95" fill="url(#armyNavy)" stroke="url(#armyGold)" stroke-width="4" filter="url(#armyGlow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,2" opacity="0.6"/>

  <!-- Outer Ring Text Arc -->
  <path id="armyTopArc" d="M 28,100 A 72,72 0 1,1 172,100" fill="none" stroke="none"/>
  <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="8.8" font-weight="900" fill="#FEF08A" letter-spacing="1.8" text-anchor="middle">
    <textPath href="#armyTopArc" startOffset="50%">ARMY INSTITUTE OF BUSINESS ADMINISTRATION</textPath>
  </text>

  <path id="armyBottomArc" d="M 172,100 A 72,72 0 0,1 28,100" fill="none" stroke="none"/>
  <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#BAE6FD" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#armyBottomArc" startOffset="50%">LEADERSHIP &amp; EXCELLENCE</textPath>
  </text>

  <!-- Laurel Wreath of Academic Honor -->
  <g fill="url(#armyGold)" opacity="0.9" transform="translate(100,105) scale(0.75)">
    <!-- Left Leaves -->
    <path d="M -50,10 C -55,-10 -40,-35 -20,-50 C -25,-30 -40,-10 -40,10 Z"/>
    <path d="M -45,-15 C -40,-25 -32,-35 -20,-42 C -23,-30 -30,-20 -35,-10 Z"/>
    <path d="M -55,-35 C -45,-45 -35,-52 -15,-58 C -22,-48 -32,-40 -45,-30 Z"/>
    <path d="M -35,30 C -45,15 -48,-5 -45,-25 C -40,-10 -35,10 -25,25 Z"/>

    <!-- Right Leaves -->
    <path d="M 50,10 C 55,-10 40,-35 20,-50 C 25,-30 40,-10 40,10 Z"/>
    <path d="M 45,-15 C 40,-25 32,-35 20,-42 C 23,-30 30,-20 35,-10 Z"/>
    <path d="M 55,-35 C 45,-45 35,-52 15,-58 C 22,-48 32,-40 45,-30 Z"/>
    <path d="M 35,30 C 45,15 48,-5 45,-25 C 40,-10 35,10 25,25 Z"/>
  </g>

  <!-- Crossed Sabers / Swords (Army Heritage) -->
  <g transform="translate(100, 102) scale(0.68)" filter="url(#armyGlow)">
    <!-- Saber 1 (\) -->
    <g transform="rotate(45)">
      <!-- Blade -->
      <path d="M -3,-65 L 3,-65 L 2,25 L -2,25 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8"/>
      <path d="M 0,-65 L 3,-65 L 2,25 L 0,25 Z" fill="#94A3B8"/>
      <!-- Crossguard -->
      <rect x="-14" y="25" width="28" height="5" rx="2" fill="url(#armyGold)"/>
      <circle cx="-13" cy="27.5" r="2.5" fill="url(#armyGold)"/>
      <circle cx="13" cy="27.5" r="2.5" fill="url(#armyGold)"/>
      <!-- Grip -->
      <rect x="-3" y="30" width="6" height="18" rx="1.5" fill="#78350F" stroke="url(#armyGold)" stroke-width="0.8"/>
      <!-- Pommel -->
      <circle cx="0" cy="51" r="5" fill="url(#armyGold)"/>
    </g>

    <!-- Saber 2 (/) -->
    <g transform="rotate(-45)">
      <!-- Blade -->
      <path d="M -3,-65 L 3,-65 L 2,25 L -2,25 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="0.8"/>
      <path d="M 0,-65 L 3,-65 L 2,25 L 0,25 Z" fill="#CBD5E1"/>
      <!-- Crossguard -->
      <rect x="-14" y="25" width="28" height="5" rx="2" fill="url(#armyGold)"/>
      <circle cx="-13" cy="27.5" r="2.5" fill="url(#armyGold)"/>
      <circle cx="13" cy="27.5" r="2.5" fill="url(#armyGold)"/>
      <!-- Grip -->
      <rect x="-3" y="30" width="6" height="18" rx="1.5" fill="#78350F" stroke="url(#armyGold)" stroke-width="0.8"/>
      <!-- Pommel -->
      <circle cx="0" cy="51" r="5" fill="url(#armyGold)"/>
    </g>

    <!-- Center Heraldic IBA Shield -->
    <path d="M -26,-24 L 26,-24 Q 28,15 0,38 Q -28,15 -26,-24 Z" fill="url(#armyCrimson)" stroke="url(#armyGold)" stroke-width="2.5"/>
    
    <!-- Bold 'IBA' Monogram in Shield -->
    <text x="0" y="2" font-family="'Inter', 'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="1">IBA</text>
    
    <!-- Academic Torch & Star on Shield Top -->
    <polygon points="0,-18 3,-11 10,-11 4,-7 6,0 0,-4 -6,0 -4,-7 -10,-11 -3,-11" fill="url(#armyGold)"/>
  </g>
</svg>
