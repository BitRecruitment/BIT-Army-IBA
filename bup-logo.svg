<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="bupGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="bupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="bupDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#bupGreen)" stroke="url(#bupGold)" stroke-width="4" filter="url(#bupDrop)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#bupGold)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Text Arc Simulation (Circular Typography) -->
  <path id="textCircleTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" stroke="none"/>
  <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#FEF3C7" letter-spacing="1.5" text-anchor="middle">
    <textPath href="#textCircleTop" startOffset="50%">BANGLADESH UNIVERSITY OF PROFESSIONALS</textPath>
  </text>

  <path id="textCircleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" stroke="none"/>
  <text font-family="'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#FDE68A" letter-spacing="2" text-anchor="middle">
    <textPath href="#textCircleBottom" startOffset="50%">EXCELLENCE THROUGH KNOWLEDGE</textPath>
  </text>

  <!-- Center Shield Base -->
  <g transform="translate(100, 104) scale(0.65)" filter="url(#bupDrop)">
    <!-- Sunburst Radiance behind Shield -->
    <circle cx="0" cy="-10" r="45" fill="url(#bupGlow)"/>
    
    <!-- Shield Outline -->
    <path d="M -45,-45 L 45,-45 Q 48,15 0,55 Q -48,15 -45,-45 Z" fill="#064E3B" stroke="url(#bupGold)" stroke-width="3"/>
    
    <!-- Red Sun / National Element -->
    <circle cx="0" cy="-15" r="22" fill="#DC2626"/>
    
    <!-- Golden Sunrays -->
    <path d="M 0,-40 L 3,-22 L -3,-22 Z" fill="#FBBF24"/>
    <path d="M 18,-35 L 12,-20 L 7,-24 Z" fill="#FBBF24"/>
    <path d="M -18,-35 L -7,-24 L -12,-20 Z" fill="#FBBF24"/>
    <path d="M 25,-18 L 14,-15 L 13,-20 Z" fill="#FBBF24"/>
    <path d="M -25,-18 L -13,-20 L -14,-15 Z" fill="#FBBF24"/>

    <!-- Open Book of Knowledge -->
    <g transform="translate(0, 8)">
      <!-- Left Page -->
      <path d="M -2,-8 C -12,-16 -28,-14 -32,-8 C -33,5 -30,18 -2,12 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
      <line x1="-28" y1="-3" x2="-6" y2="4" stroke="#9CA3AF" stroke-width="1.2"/>
      <line x1="-28" y1="2" x2="-6" y2="9" stroke="#9CA3AF" stroke-width="1.2"/>
      <line x1="-26" y1="7" x2="-10" y2="12" stroke="#9CA3AF" stroke-width="1.2"/>

      <!-- Right Page -->
      <path d="M 2,-8 C 12,-16 28,-14 32,-8 C 33,5 30,18 2,12 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
      <line x1="6" y1="4" x2="28" y2="-3" stroke="#9CA3AF" stroke-width="1.2"/>
      <line x1="6" y1="9" x2="28" y2="2" stroke="#9CA3AF" stroke-width="1.2"/>
      <line x1="10" y1="12" x2="26" y2="7" stroke="#9CA3AF" stroke-width="1.2"/>

      <!-- Book Spine & Ribbon -->
      <path d="M -2,-8 L 0,14 L 2,-8 Z" fill="#B45309"/>
      <path d="M 0,14 L -4,24 L 0,21 L 4,24 Z" fill="#DC2626"/>
    </g>

    <!-- Star of Excellence -->
    <polygon points="0,-36 3,-28 11,-28 5,-23 7,-15 0,-20 -7,-15 -5,-23 -11,-28 -3,-28" fill="#FDE047" stroke="#B45309" stroke-width="0.8"/>
  </g>
</svg>
